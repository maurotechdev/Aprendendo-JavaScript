<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        let result="";
        
        var anynumber = Number(prompt("Número:"));

        for (let i = 1; i<=anynumber; i++){
            if(i%2==0){
                result= result + "-" + i;
            }
        }
       
        alert(result);
    </script>
</body>
</html>
